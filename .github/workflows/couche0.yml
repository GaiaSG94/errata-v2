          esac
          if [ -z "$PR_NUMBER" ]; then
            ref="${REF#refs/heads/}"
            case "$ref" in
              */pr-*-*)
                PR_NUMBER="${ref#*pr-}"
                PR_NUMBER="${PR_NUMBER%%-*}"
                ;;
            esac
          fi
          if [ -z "$PR_NUMBER" ]; then
            case "${REF:-$GITHUB_REF_NAME}" in
              *mergify/merge-queue/*)
                echo "Branche de lot Mergify : le pÃ©rimÃ¨tre a dÃ©jÃ  Ã©tÃ© jugÃ© sur chaque PR avant son entrÃ©e en file â€” rien de neuf Ã  contrÃ´ler ici."
                ;;

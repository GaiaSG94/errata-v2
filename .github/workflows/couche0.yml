  # `merge_group` est l'Ã©vÃ©nement d'aujourd'hui ; le `push` sur
  # `gh-readonly-queue/**` reste pour les file(s) construites en push.
  merge_group:
  push:
    branches:
      - 'gh-readonly-queue/**'
      # PAS de `mergify/merge-queue/**` (retirÃ© le 31/10) : la PR que la file
      # ouvre sur sa branche de lot dÃ©clenche dÃ©jÃ  `pull_request` (types
      # `opened` / `synchronize`), donc le check existe sur l'arbre fusionnÃ©.
      # Le `push` en plus ne servait qu'Ã  crÃ©er un deuxiÃ¨me run pour la mÃªme

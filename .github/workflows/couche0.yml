jobs:
  couche0:
    name: couche0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: RÃ©cupÃ©rer le garde depuis main, puis contrÃ´ler la PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # `merge_group` ne porte pas `pull_request` : le numÃ©ro de PR vit dans
          # le nom du ref (`refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>`).
          REF: ${{ github.event.merge_group.head_ref || github.ref_name }}
